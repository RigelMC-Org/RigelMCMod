<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appeal Status</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
    background: #f5f6f8; color: #1a1a1a; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e6e6e6; }
    .card { background: #1f232b !important; border-color: #2c313c !important; }
    input { background: #14171c !important; color: #e6e6e6 !important; border-color: #333944 !important; }
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .card { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; }
  label { display: block; font-weight: 600; margin: 0 0 0.35rem; font-size: 0.92rem; }
  input[type="text"] {
    padding: 0.6rem 0.7rem; border: 1px solid #c7ccd4; border-radius: 6px; font: inherit; font-size: 0.95rem;
    width: 12rem; box-sizing: border-box;
  }
  button {
    margin-left: 0.5rem; padding: 0.62rem 1.1rem; border: none; border-radius: 6px; background: #2563eb;
    color: #fff; font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  .pill { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 999px; font-weight: 700; font-size: 0.82rem; text-transform: uppercase; }
  .pill-pending { background: #fef3c7; color: #92400e; }
  .pill-approved { background: #dcfce7; color: #166534; }
  .pill-denied { background: #fee2e2; color: #991b1b; }
  .muted { color: #5b6472; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Check Appeal Status</h1>
<div class="card">
  <form method="get" action="/status">
    <label for="id">Appeal ID</label>
    <input type="text" id="id" name="id" value="%%ID_VALUE%%" placeholder="e.g. 42" inputmode="numeric">
    <button type="submit">Check</button>
  </form>
</div>
%%RESULT%%
</body>
</html>
