<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ban Appeal</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
    background: #f5f6f8; color: #1a1a1a; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e6e6e6; }
    .card { background: #1f232b !important; border-color: #2c313c !important; }
    .ban-summary { background: #262b34 !important; border-color: #333944 !important; }
    input, textarea { background: #14171c !important; color: #e6e6e6 !important; border-color: #333944 !important; }
    .muted { color: #9099a8 !important; }
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .card { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; }
  .ban-summary { background: #f0f1f4; border: 1px solid #dfe3e8; border-radius: 8px; padding: 1rem; margin-bottom: 1.25rem; font-size: 0.92rem; }
  .ban-summary div { margin: 0.15rem 0; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.35rem; font-size: 0.92rem; }
  textarea, input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem; border: 1px solid #c7ccd4; border-radius: 6px;
    font: inherit; font-size: 0.95rem;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    margin-top: 1.25rem; padding: 0.65rem 1.4rem; border: none; border-radius: 6px; background: #2563eb;
    color: #fff; font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .muted { color: #5b6472; font-size: 0.85rem; }
  .error { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<h1>Ban Appeal</h1>
<p class="muted">Explain why you believe this ban should be lifted. A staff member will review your appeal.</p>
<div class="card">
  <div class="ban-summary">%%BAN_SUMMARY%%</div>
  %%ERROR%%
  <form method="post" action="/">
    <input type="hidden" name="case" value="%%CASE%%">
    <label for="message">Your appeal</label>
    <textarea id="message" name="message" maxlength="%%MAX_LENGTH%%" required placeholder="Explain what happened and why you believe this ban should be lifted..."></textarea>
    <label for="contact">Contact info (optional)</label>
    <input type="text" id="contact" name="contact" maxlength="256" placeholder="Discord username, email, etc. - so staff can follow up if needed">
    <button type="submit">Submit Appeal</button>
  </form>
</div>
</body>
</html>
