<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ban Appeal</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
    background: #f5f6f8; color: #1a1a1a; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e6e6e6; }
    .card { background: #1f232b !important; border-color: #2c313c !important; }
    input { background: #14171c !important; color: #e6e6e6 !important; border-color: #333944 !important; }
    .muted { color: #9099a8 !important; }
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .card { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; }
  label { display: block; font-weight: 600; margin: 0 0 0.35rem; font-size: 0.92rem; }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem; border: 1px solid #c7ccd4; border-radius: 6px;
    font: inherit; font-size: 0.95rem;
  }
  button {
    margin-top: 1rem; padding: 0.65rem 1.4rem; border: none; border-radius: 6px; background: #2563eb;
    color: #fff; font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .muted { color: #5b6472; font-size: 0.85rem; margin-top: 1.5rem; }
  .error { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<h1>Ban Appeal</h1>
<p class="muted">Enter your Minecraft username to find your ban and submit an appeal. If you have a direct appeal link from your ban screen, use that instead.</p>
<div class="card">
  %%ERROR%%
  <form method="get" action="/">
    <label for="username">Minecraft Username</label>
    <input type="text" id="username" name="username" required placeholder="Your in-game name" autofocus>
    <button type="submit">Find My Ban</button>
  </form>
</div>
<p class="muted">Already submitted an appeal? <a href="/status">Check its status</a>.</p>
</body>
</html>
