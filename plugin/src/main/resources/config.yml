# RigelMCMod configuration.
# See docs/architecture.md and docs/permissions.md for the full design rationale
# behind each section.

server:
  # The address players actually connect to - purely informational, never used to make a
  # networking decision. Substituted into the "{ip}" placeholder in tablist.header/
  # tablist.footer and scoreboard.lines below, and shown on the web panel as
  # "Server IP: <value>".
  ip-domain: "play.rigelmc.org"

identity:
  # Force RigelMCMod to treat every non-Bedrock player as a verified premium (JAVA)
  # identity, regardless of what Bukkit's own server.getOnlineMode() reports. This
  # matters a lot on a Velocity-proxied setup (this project's documented target
  # topology): the backend server's own online-mode is typically FALSE even for
  # genuinely premium players, since Velocity's modern forwarding handles real
  # authentication and the backend must run "offline" to accept forwarded connections
  # at all - so Bukkit's own flag can't be trusted to mean "this network only has
  # verified accounts." Set this to true explicitly if your network is premium-only
  # (Bedrock via Floodgate is still detected and excluded separately either way).
  #
  # Purely a JAVA-vs-OFFLINE classification for tracking/display purposes as of this
  # writing - it does NOT gate rank trust: rank.RankService#rankOf honors a player's
  # stored rank unconditionally regardless of identity type, matching TFM's own real
  # behavior, since this server's real population includes GeyserMC/Floodgate and
  # Eaglercraft players as a core, intended part of its community, not an edge case
  # (see rankOf()'s own javadoc for the full reasoning behind that reversal). Leave
  # this false unless you specifically know your whole network is premium-verified.
  online-mode: false

chat:
  # Translate &-color codes typed in public chat messages into actual colors/
  # formatting (e.g. "&cHello" -> a red "Hello") - open to every player by default,
  # not rank-gated, matching /nick and /tag's own precedent rather than Essentials'
  # typical permission-gated essentials.chat.color. Only relevant now that
  # EssentialsChat (which used to do its own, permission-gated version of this) is no
  # longer running its chat formatting.
  color-codes-enabled: true

storage:
  # "sqlite" (default, zero-config) or "mysql" / "mariadb" for shared network storage.
  type: sqlite
  sqlite:
    file: data.db
  mysql:
    host: localhost
    port: 3306
    database: rigelmcmod
    username: rigelmcmod
    password: ""
    use-ssl: false

# Per-module enable/disable toggles. Every module defaults to enabled except webpanel,
# which is opt-in by design (see docs/architecture.md "Ban system: ... web panel").
modules:
  # Auto-op is the defining trait of a Free-OP server: every joining player is granted
  # vanilla Bukkit operator status unconditionally (see core.AutoOpModule). This is why
  # protect.command-access below matters so much - it's the mechanism that claws back
  # specific dangerous commands (including other plugins' op-gated ones, e.g.
  # Essentials' /tpo) from the auto-op'd masses while still allowing RigelMCMod-ranked
  # staff to use them.
  autoop:
    enabled: true
  rank:
    enabled: true
  punish:
    enabled: true
  chat:
    enabled: true
  protect:
    enabled: true
  world:
    enabled: true
  rollback:
    enabled: true
  disguise:
    enabled: true
  skin:
    enabled: true
  fun:
    enabled: true
  webpanel:
    enabled: false
  discord:
    enabled: false
  announce:
    enabled: true
  vanish:
    enabled: true
  motd:
    enabled: true
  tag:
    enabled: true
  nick:
    enabled: true
  scoreboard:
    enabled: true
  rmcm:
    enabled: true
  # Anti-nuke/anti-spam/anti-drop/movement-validator/gamerule/mob-spam/potion/text-filter -
  # see protect.anti-grief below for every individual toggle within this module.
  antigrief:
    enabled: true
  # Event-level crash-exploit protections (items/entity names/signs/spawners) - see
  # protect.crash below for every individual toggle within this module.
  crashprotect:
    enabled: true
  # WorldEdit/FAWE abuse prevention - command-preprocess string checks (op throttle,
  # blocked-block-type check, radius cap) AND, once WorldEdit/FAWE is actually installed,
  # the real EditSessionEvent extent-chain tier (per-block /protectarea enforcement,
  # selection-volume/container/blocked-type caps) - see protect.worldedit below for every
  # individual toggle.
  worldeditprotect:
    enabled: true
  # /protectarea (aliases /protectregion, /protect) - DB-backed region protection with a
  # real per-region owner/member bypass list and flags - see protect.protectarea below.
  # Enforced both via Bukkit events (regular play) and, when WorldEdit/FAWE is installed,
  # per-block inside its own EditSessionEvent pipeline - see
  # protect.worldedit.extent.ProtectAreaExtent.
  protectarea:
    enabled: true
  # /cmdspy, /signspy, /potionspy, /whohas, /findip, /radar.
  investigate:
    enabled: true
  # /myadmin - self-service login-message + info for a staff member's own admin entry.
  myadmin:
    enabled: true
  # /mobpurge and /entitywipe.
  cleanup:
    enabled: true
  # /lockdown - off by default in the sense that lockdown itself always starts
  # deactivated (see core.LockdownModule) regardless of this flag; this flag just
  # controls whether the command/listener exist at all.
  lockdown:
    enabled: true
  # /tickfreeze and /tickrate - thin wrappers over Paper's own ServerTickManager.
  tickfreeze:
    enabled: true
  # /spawnmob - a safe, NBT-free alternative to vanilla /summon (which is blocked below
  # Senior Admin - see protect.command-access's /summon entry).
  spawnmob:
    enabled: true

punish:
  freeze:
    # Auto-unfreeze safety net (minutes) - matches TFM's own 5-minute default so a
    # forgotten frozen player doesn't stay stuck forever. 0 disables the timeout.
    auto-unfreeze-minutes: 5
  ban:
    # Fixed duration for the plain /ban quick-ban command.
    default-duration-hours: 24
    # Lookback window for the automatic CoreProtect rollback /ban always triggers.
    # Requires CoreProtect to be installed; /ban still bans without it, just without
    # the rollback step.
    auto-rollback-lookback-hours: 1
  tban:
    # /tban's rollback is opt-in via the -r/--rollback flag, unlike /ban.
    default-rollback-lookback-hours: 1
  strikes:
    # /warn's auto-escalation - a time-decayed strike count per player, escalating through
    # the existing ban system (not a parallel one) once it reaches a configured threshold.
    #
    # Hours since a player's last /warn before their strike count fully resets to 0 (not a
    # gradual step-down). 0 (or negative) disables decay entirely - strikes stay until
    # manually cleared.
    decay-hours: 24
    # strike-count: ban-duration-hours (0 = kick only, negative = permanent). A strike
    # count with no entry here (strike 1, by default) is a warning only - no ban. One
    # high-water-mark entry also covers every count above it (e.g. "4": -1 also applies to
    # strike 5, 6, ...), so you don't need an entry for every possible count.
    thresholds:
      "2": 1
      "3": 24
      "4": -1

protect:
  # Tiered command access control - TFM's own "blockcmd" syntax, studied directly from
  # its real CommandBlocker/CommandBlockerEntry source (not reimplemented from a
  # description), so this list is exactly as expressive as TFM's and you can extend it
  # yourself the same way. Each entry is a colon-delimited string:
  #
  #   rank:action:/command [args...]:message
  #
  # rank   - the minimum rank allowed to run it (RigelMCMod's own ladder, not TFM's):
  #            n = Nobody - blocked for every *player*, short of the rigelmcmod.protect.
  #                bypass.blockedcommands permission (an explicit per-player grant, not a
  #                rank). This is also how to make a command console/RCON-only: this
  #                system only ever intercepts player-issued commands
  #                (PlayerCommandPreprocessEvent), so an "n" entry never touches console
  #                or RCON input at all - the command keeps working there unchanged.
  #            m = Moderator and above
  #            a = Admin and above
  #            s = Senior Admin and above
  # action - what happens on a denied attempt:
  #            b = block, show the message
  #            k = block, show the message, AND kick the sender
  #            u = block, show Minecraft's generic "unknown command" (hides it exists)
  # command - the base command (leading slash optional) plus an optional argument
  #           pattern. {?} matches exactly one argument at that position; {*} matches one
  #           or more trailing arguments (only valid as the last token). No pattern at
  #           all matches regardless of arguments. When several rules exist for the same
  #           base command, the most specific one wins - so you can block a whole command
  #           except for a specific sub-command, exactly like TFM:
  #             - 's:b:/clear {*}:_'           # allow "/clear", block "/clear <anything>"
  #             - 's:b:/clear inventory {*}:_' # allow "/clear inventory", block "/clear inventory <x>"
  # message - optional, &-color-coded. Omit or use "_" for the default
  #           "That command is blocked." message.
  #
  # A namespaced invocation (e.g. /essentials:tp instead of the bare /tp) is always
  # blocked outright, for everyone, regardless of the rules below - TFM does exactly the
  # same (confirmed in its source) - see BlockedCommandListener's javadoc for why.
  #
  # Reloadable without a restart via /rmcm reload.
  command-access:
    # ---- RigelMCMod's own entries -----------------------------------------------------
    - 'n:b:/stop:_'
    - 's:k:/restart:_'
    - 's:b:/reload:_'
    - 's:b:/plugman:_'
    - 's:b:/whitelist:_'
    - 's:b:/save-all:_'
    # /op is intentionally NOT blocked here - RigelMCMod ships its own /op (see
    # core.AutoOpModule), open to everyone by design: vanilla op status carries no
    # RigelMCMod rank/permission of its own, so letting anyone restore their own or
    # another online player's op status can't escalate real privilege - it just undoes
    # what a troll did with /deop. /deop and /opall are the ones that actually need a
    # Staff gate, and both already enforce it themselves; the entries below are
    # defense-in-depth (same rationale as the /vanish entry further down) in case
    # something other than RigelMCMod's own command ever answers those two literals.
    - 'm:b:/deop:_'
    - 'm:b:/opall:_'
    - 'm:b:/deopall:_'
    # Essentials' /tpo(here) bypasses the target's teleport-request confirmation
    # entirely - fine for real staff, dangerous in the hands of the auto-op'd masses who
    # hold no real RigelMCMod rank. Gated to moderator+ for exactly that reason (see the
    # "modules.autoop" comment above).
    - 'm:b:/tpo:_'
    - 'm:b:/tpohere:_'
    # RigelMCMod ships its own, stronger vanish (/rvanish - see the vanish/ module) that
    # hides staff from non-staff ops too, not just regular players. Blocking the bare
    # "vanish" label here stops the auto-op'd masses from invoking whichever plugin's
    # /vanish ends up bound to that name, regardless of registration order.
    - 'm:b:/vanish:_'
    # CoreProtect (if installed) ships every one of its commands default: op, which on
    # this Free-OP server means every player would otherwise inherit full rollback/
    # restore/purge access purely from holding vanilla operator status - see
    # rank.PermissionGate's explicit negation of the underlying permission nodes for the
    # actual fix; these are defense-in-depth at the command layer, same rationale as
    # /vanish and /tpo above. /co i and /co l(ookup) (the inspector tool) are deliberately
    # left unblocked - regular players should be able to see who's messing with their own
    # builds, just not roll anything back themselves.
    - 'm:b:/co rollback {*}:_'
    - 'm:b:/co restore {*}:_'
    - 'm:b:/co purge {*}:_'
    - 'm:b:/co reload {*}:_'
    - 'm:b:/co banitem {*}:_'
    - 'm:b:/co config {*}:_'

    # ---- Ported from TotalFreedomMod's own default blocked_commands (read directly
    # from its production config.yml) - commands TFM's real network has found genuinely
    # exploitable/disruptive on a Free-OP server. TFM's "Super Admin" tier maps to our
    # top rank, senior_admin; a couple of its senior-admin "auto-eject" entries became
    # "s:k" here (block + kick) - see restart above.

    # Fully disabled - RigelMCMod (or a companion plugin) already covers the legitimate
    # need, or the command is a pure exploit/grief vector with no routine use.
    - 'n:b:/ban-ip:&7Use /permban <ip> instead.'
    - 'n:b:/pardon:&7Use /unban instead.'
    - 'n:b:/pardon-ip:&7Use /unban instead.'
    - 'n:b:/time:&7Server-side time changing is disabled.'
    - 'n:b:/toggledownfall:_'
    - 'n:b:/effect:_'
    - 'n:b:/enderchest:_'
    - 'n:b:/spreadplayers:_'
    - 'n:b:/execute:_'
    - 'n:b:/blockdata:_'
    - 'n:b:/clearhistory:_'
    - 'n:b:/save-on:_'
    - 'n:b:/save-off:_'
    - 'n:b:/playsound:_'
    - 'n:b:/protocol:_'
    - 'n:b:/packet:_'
    - 'n:b:/packetlog:_'
    - 'n:b:/filter:_'
    - 'n:b:/thaw:_'
    - 'n:b:/skinrestorer:_' # SkinsRestorer's own admin/reload command, if present

    # Senior Admin+ - powerful but occasionally legitimate for real staff.
    # /kick is intentionally NOT blocked here - RigelMCMod ships its own /kick (see
    # punish.PunishModule#kickCommand), gated to Moderator+ by its own .requires() check.
    # This entry used to block the vanilla/Essentials /kick back before RigelMCMod had
    # one of its own; leaving it here would silently re-raise the effective tier to
    # Senior Admin+ for everyone, since this command-access check runs (and can cancel
    # the event) before Brigadier dispatch ever reaches PunishModule's own rank check -
    # same class of self-conflict already called out for /op above.
    - 's:b:/socialspy:_' # reads other players' private messages
    - 's:b:/replaceitem:_'
    - 's:b:/kill:_' # includes mass-kill selectors like "/kill @e"
    - 's:b:/scoreboard:_' # same team/objective machinery rank.NameTagService uses for nametag colors
    - 's:b:/setspawn:_'
    - 's:b:/tellraw:_' # can spoof messages appearing to be from anyone/the system
    - 's:b:/forestgen:_'
    - 's:b:/setidletimeout:_'
    - 's:b:/mail sendall:_' # only this sub-command - bare /mail still works for everyone
    - 's:b:/eco reset:_' # only this sub-command - other /eco uses still work
    - 's:b:/defaultgamemode:_'
    - 's:b:/title:_'
    - 's:b:/worldborder:_' # can trap/kill players by shrinking the border
    - 's:b:/weather:_'
    - 's:b:/tpall:_' # mass-teleports every online player
    - 's:b:/setblock:_'
    - 's:b:/gamerule:_' # e.g. disabling mob-griefing/fire-spread protections
    - 's:b:/fill:_' # can instantly overwrite a whole region (lava, bedrock, etc.)
    # Vanilla /summon accepts an arbitrary raw NBT argument - the same crash-exploit
    # surface protect.crash's item/entity guards exist to close elsewhere (malformed/
    # oversized NBT, cursed component data, ...), plus unrestricted mob-spam potential.
    # Moderator+ get a safe, NBT-free alternative instead - see fun.SpawnMobModule's
    # /spawnmob (type + capped amount only, no raw NBT possible) - /summon itself stays
    # reserved for the most trusted tier.
    - 's:b:/summon:_'
    # Paper's own /tick freeze|rate|... can pause or drastically slow the entire
    # server's tick loop - see core.TickFreezeModule's /tickfreeze and /tickrate for the
    # intended, publicly-announced way in for Senior Admin+.
    - 's:b:/tick:_'
    # WorldEdit/FastAsyncWorldEdit, if installed - harmless entries if it isn't. WorldEdit's
    # own shortcut commands are double-slash ("//generate") - written with both slashes
    # here since only the first is stripped before matching.
    - 's:b:/superpickaxe:_'
    - 's:b:/brush:_'
    - 's:b:/size:_'
    - 's:b:/mat:_'
    - 's:b:/mask:_'
    - 's:b:/gmask:_'
    - 's:b://generate:_'
    - 's:b://mask:_'
    - 's:b://butcher:_'
    - 's:b://snow:_'

  # Anti-grief primitives - the Phase 2 work referenced in ProtectModule's javadoc.
  # Studied from TFM's real AntiNuke/AntiSpam/AntiDrop/MovementValidator/GameRuleHandler/
  # GameModeGuard/MobBlocker/EventBlocker/PotionBlocker/TextFilterService. Every guard is
  # independently toggleable; none of this touches command-access above. Numeric limits
  # here are picked as sane, non-disruptive starting points for a legitimate builder on a
  # Free-OP server, not tuned against a real network - retune freely.
  anti-grief:
    anti-nuke:
      enabled: true
      # Sliding 1-second window. A legitimate player rarely breaks/places anywhere near
      # this fast even with efficient tools; a nuke client routinely blows past it.
      max-breaks-per-second: 20
      max-places-per-second: 20
      # A break/place farther than this many blocks from the player's eye location is
      # flagged as "freecam nuking" (breaking terrain the client shouldn't be able to
      # reach) regardless of the rate limits above.
      freecam-range: 8.0
      # What happens on a breach: "kick" (default), "freeze" (see punish.freeze once
      # sub-phase B ships), or "alert" (log + notify staff only, take no action).
      action: kick
    anti-spam:
      enabled: true
      chat:
        max-messages-per-10s: 5
        # A message repeated at least this many times within the window counts as spam.
        repeat-window-seconds: 30
        max-repeats: 3
      commands:
        max-commands-per-10s: 8
      action: kick
    anti-drop:
      enabled: true
      max-drops-per-10s: 15
      action: cancel
    # TFM ref: EventBlocker's ALLOW_EXPLOSIONS/ALLOW_FIRE_SPREAD, studied directly - one
    # deliberate deviation: TFM's own "allowed" path still always zeroes the explosion
    # yield (so terrain is never actually damaged by TNT either way in TFM's real
    # behavior); here the toggle means what it says instead - disabled just clears the
    # affected block list (the explosion still happens: sound, entity damage, knockback -
    # just no block damage), enabled leaves block damage fully vanilla. Both off by
    # default - a safety-first stance for a public Free-OP server; flip on for an event.
    tnt-damage:
      enabled: false
    # Fire spreading to new blocks (from existing fire/lava/lightning). Deliberately
    # doesn't touch flint-and-steel placement itself, only spread - matches TFM's own
    # separate allow.fire_place vs allow.fire_spread distinction.
    fire-spread:
      enabled: false
    # Movement validator + world border - out-of-bounds joins/teleports/moves are
    # relocated to spawn. "alert-only" logs/notifies staff without actually relocating,
    # for testing a new radius before enforcing it.
    movement:
      enabled: true
      alert-only: false
      world-border:
        # Radius in blocks from world spawn (0,0). 0 disables the border but keeps the
        # rest of the movement validator active.
        radius: 10000
    gamerules:
      enabled: true
      # How often configured defaults are silently re-applied to every loaded world.
      enforce-interval-minutes: 5
      # Gamerule -> value re-applied on the interval above. Empty by default - add only
      # the ones you actually want enforced; anything omitted here is left alone.
      defaults: {}
      # Changing any of these (via /gamerule or a plugin) is logged and broadcast to
      # staff even though the command itself may already be blocked - defense in depth,
      # see command-access's own "s:b:/gamerule:_" entry above.
      malicious:
        - doMobGriefing
        - tntExplodes
        - mobGriefing
    gamemode-flood:
      enabled: true
      max-switches-per-10s: 4
    mob-spam:
      enabled: true
      # No ordinary ambient wild mob spawning anywhere on the server, hostile or
      # passive - only CreatureSpawnEvent's NATURAL reason is affected; spawners,
      # breeding, eggs, dispensers, and plugin-spawned mobs are untouched. An explicit
      # product decision for this server, defaulting to true.
      disable-natural-spawns: true
      # Off by default - a stricter, blanket opt-in on top of disable-natural-spawns
      # above: when true, EVERY CreatureSpawnEvent whose reason isn't COMMAND is
      # blocked - natural spawns, spawners, breeding, spawn eggs (including dispensed
      # ones), and any other plugin-spawned mob are all blocked, not just ambient
      # natural spawning. /summon and fun.SpawnMobModule's /spawnmob (both COMMAND-
      # reasoned) are unaffected either way - see RigelConfig#onlySummonSpawnsAllowed.
      only-summon-allowed: false
      max-mobs-per-world: 200
      # Minimum seconds between spawns of the same entity type from a spawner/spawn-egg
      # within a small radius of the last spawn.
      per-type-cooldown-seconds: 1
    potions:
      enabled: true
      # Blocks a thrown splash/lingering potion carrying a lethal instant-damage
      # amplifier (or an excessive effect count) from a non-staff thrower.
      block-lethal: true
    text-filter:
      # Off by default - no canonical word list is bundled (see chat.ImpersonationGuard's
      # javadoc for the same "not a general profanity filter" stance). Add your own
      # regexes before enabling.
      enabled: false
      patterns: []
      # Duration of the automatic /tban a chat/command match triggers.
      ban-duration-hours: 24

  # Event-level crash-exploit protections (TFM parity - "E1" tier of the wider suite, see
  # docs for the packet-level "E2" tier). Pure Bukkit/Paper public API, no new dependency.
  # Moderator+ are exempt from items/signs (staff are trusted to build special-purpose
  # ones without getting flagged) - the spawner guard has no such exemption, since blocking
  # hanging-entity spawner output isn't a punishment, it's a client-crash defense that
  # applies regardless of who placed the spawner.
  crash:
    items:
      enabled: true
      # Plain-text length caps - a display name/lore line/book page far past what any
      # legitimate item needs, but well past normal survival-mode text limits, is either a
      # deliberate lag/crash payload or a client-rendering bomb.
      max-name-length: 64
      max-lore-lines: 24
      max-lore-line-length: 256
      max-book-pages: 100
      max-book-page-length: 1024
      # Shulker-box-in-shulker-box (or bundle-in-bundle) nesting depth - the classic
      # recursive-open crash vector. 2 allows one level of "shulker inside a chest" without
      # flagging normal storage play.
      max-container-depth: 2
      max-potion-effects: 24
      max-firework-explosions: 64
      max-banner-patterns: 256
    entities:
      enabled: true
      # A custom mob/item-frame name far past this is stripped (not the entity itself -
      # just its name) rather than blocked outright.
      max-name-length: 64
    signs:
      enabled: true
      max-line-length: 384
    spawners:
      enabled: true
    # Packet-level ("E2") tier - catches abuse that bypasses normal Bukkit events
    # entirely. Requires PacketEvents to be separately installed as its own plugin
    # (soft dependency, see paper-plugin.yml) - no-ops cleanly if it isn't, and E1 above
    # keeps working regardless. Its own toggle, independent of modules.crashprotect.enabled.
    packets:
      enabled: true
      # Packets per second before further ones of that type are silently dropped.
      # 0/negative disables the individual check. Moderator+ are exempt.
      max-chat-per-second: 10
      max-commands-per-second: 15
      max-movement-per-second: 100

  # WorldEdit/FAWE abuse prevention, two tiers - TFM ref: bridge/WorldEditHook.java,
  # studied directly. "enabled" below gates BOTH tiers: the command-preprocess, string-
  # matching layer (op throttle, blocked-block-type check, radius cap) AND the deeper
  # EditSessionEvent extent-chain layer (per-block /protectarea enforcement, the
  # selection-volume/container/blocked-type limits below) - see
  # protect.worldedit.extent.WorldEditExtentService. Moderator+ exempt from every limit.
  worldedit:
    enabled: true
    throttle:
      enabled: true
      max-ops: 5
      window-ms: 1000
      # Violations past max-ops within one window before an auto-eject (a strike via
      # punish.strikes, see RigelConfig#worldEditThrottleEjectThreshold, plus a kick).
      eject-threshold: 5
    # Anvils are gravity-affected blocks (like sand/gravel) - a large //set anvil fill can
    # convert into a simultaneous mass FallingBlock entity spawn the instant something
    # triggers gravity, which is both a lag bomb and, since anvils deal fall damage, a way
    # to kill anyone standing underneath. The same risk applies to the rest of this list,
    # not anvils uniquely - this is deliberately non-empty by default (TFM's own
    # equivalent ships empty, which is what let the originally-reported incident happen).
    blocked-block-types:
      - anvil
      - chipped_anvil
      - damaged_anvil
      - sand
      - red_sand
      - gravel
      - white_concrete_powder
      - orange_concrete_powder
      - magenta_concrete_powder
      - light_blue_concrete_powder
      - yellow_concrete_powder
      - lime_concrete_powder
      - pink_concrete_powder
      - gray_concrete_powder
      - light_gray_concrete_powder
      - cyan_concrete_powder
      - purple_concrete_powder
      - blue_concrete_powder
      - brown_concrete_powder
      - green_concrete_powder
      - red_concrete_powder
      - black_concrete_powder
      - dragon_egg
      - scaffolding
    # Applies to WorldEdit's radius/size-taking commands (//sphere, //cyl, //pyramid,
    # brush tools, etc.).
    radius-max: 200
    # Enforced per-block inside the actual EditSessionEvent extent chain (not just a
    # command-preprocess string check) - matches TFM's own WORLDEDIT_LIMIT_MAX/
    # WORLDEDIT_MAX_CONTAINERS defaults. See protect.worldedit.extent.RigelEditExtentChain.
    limits:
      # Most blocks a single non-staff WorldEdit/FAWE edit session may write.
      max-volume: 10000
      # Most container blocks (chests, hoppers, furnaces, ...) a single non-staff session
      # may place.
      max-containers: 500

  # /protectarea (see protect.area package docs). Everything about a region itself (flags,
  # membership, overlap policy) is DB-backed and managed entirely via the command, not here -
  # these are just the two purely presentational settings.
  protectarea:
    visualize:
      # Whether "/protectarea info <name> -show" can draw a temporary particle outline at
      # all.
      enabled: true
    # Regions shown per "/protectarea list" page.
    list-page-size: 8

  # /mobpurge and /entitywipe.
  cleanup:
    mobpurge:
      # Excluded mobs are never removed by /mobpurge (manual or automatic) - protects
      # players' named pets/tamed animals/leashed mobs from an accidental griefing.
      exclude-named: true
      exclude-tamed: true
      exclude-leashed: true
      # Minutes between automatic /mobpurge runs, or 0 to disable auto-purge (on-demand
      # command only).
      auto-interval-minutes: 0
    entitywipe:
      auto-interval-minutes: 0

fun:
  disguise:
    # Disguise types (LibsDisguises DisguiseType / Bukkit EntityType names, case-
    # insensitive) no player may disguise as - enforced by disguise.DisguiseAbuseGuard.
    # Empty means "use TFM's own real default list" (see disguise.DisallowedDisguises),
    # not "nothing forbidden" - list explicitly here to actually change it.
    forbidden-types: []
  orbit:
    # Upward velocity re-applied while /orbit is toggled on - matches TFM's own
    # hardcoded Command_orbit strength (10.0).
    strength: 10.0
  jumppads:
    # Server-wide, not per-player - off | normal | normal_and_sideways. TFM ref:
    # Jumppads.JumpPadMode. Any wool-colored block launches a standing player upward
    # (and, in normal_and_sideways mode, sideways off wool on adjacent faces too).
    mode: "off"
    strength: 0.4
  landmine:
    enabled: true
    # Matches TFM's own clamp ceiling - /landmine <radius> is clamped to [2.0, this].
    max-radius: 6.0
  mp44:
    enabled: true
  trail:
    enabled: true
  spawnmob:
    # Hard cap on "/spawnmob <type> <amount>" - an anti-lag/anti-mob-spam limit, since
    # unlike vanilla /summon this command has no NBT to worry about but could still
    # dump a crowd of mobs in one spot if left uncapped.
    max-amount: 16

investigate:
  radar:
    # /radar's radius (blocks) when none is given, and the hard cap on a requested one.
    default-radius: 100
    max-radius: 500

aliases:
  # If true, RigelMCMod commands may additionally register shorter/legacy-style aliases
  # (e.g. /kick alongside /punish kick). Automatically forced off if Essentials is
  # detected at enable time, regardless of this setting - see EssentialsCollisionPolicy.
  enable-shadowing: false

# Optional per-rank prefix override (&-legacy-coded, full bracket text - e.g.
# "&8[&6SrA&8] &r"), reloadable live via /rmcm reload - no rebuild needed to retint or
# relabel a rank's prefix. Leave blank/omit a rank to keep its hardcoded default (see
# rank.Rank) - these are all commented out by default for exactly that reason. Inspired
# by TFM's own config-overridable rank prefixes (its VAULT_PREFIX_* entries), generalized
# to any rank id here instead of a fixed set of config keys.
rank-prefixes:
  moderator: ""
  admin: ""
  senior_admin: ""

# Usernames (case-insensitive, matched against last-known name) auto-granted the given
# title the next time they join - no command needed. Titles are purely cosmetic (see
# rank.Title) - this does NOT grant any rank/permissions, just the title's prefix. Any
# title id works here, not just these three built-ins; add your own via /adminconfig-style
# tooling later if needed. Safe to list a name that hasn't joined yet - nothing happens
# until they do, and re-granting an already-held title on a later join is a no-op.
titles:
  owner:
    - "LightWarp"
  executive: []
  developer: []

tablist:
  # MiniMessage format. {online}/{max} placeholders in the footer, and {ip} (server.ip-
  # domain above) in both header and footer, are substituted before parsing, refreshed
  # periodically.
  header: "<gold><bold>RigelMC"
  footer: "<gray>Online: <white>{online}</white>/<white>{max}</white> <dark_gray>|</dark_gray> <gray>IP: <white>{ip}</white>"

scoreboard:
  # Toggle independently of the tab list - modules.scoreboard.enabled.
  # MiniMessage format throughout; {online}/{max}/{ip} (server.ip-domain above)
  # placeholders substituted in lines, refreshed periodically. Empty strings are valid
  # lines (blank spacer rows).
  title: "<gold><bold>RigelMC"
  lines:
    - ""
    - "<gray>Online: <white>{online}</white>/<white>{max}</white>"
    - "<gray>IP: <white>{ip}</white>"

webpanel:
  # Off by default. Read-only dashboard (stats/bans/permban cases) on its own port. No
  # endpoint can change server state - nothing to authenticate or CSRF-protect, by design.
  port: 8081
  # Binds to localhost by default - reconfigure deliberately to expose beyond the host,
  # and put it behind your own reverse proxy/TLS if you do.
  bind-address: "127.0.0.1"
  # How often the dashboard's in-memory snapshot (online players, staff roster, recent
  # bans, current mutes) is rebuilt. The API always serves this cached snapshot, never a
  # live query per-request.
  refresh-seconds: 5
  # Read-only browse/download page for WorldEdit/FAWE schematic files - no upload endpoint
  # exists at all, by design. Same no-auth/localhost-by-default security posture as the
  # rest of this panel - see the comment above.
  schematics:
    enabled: true
    # Empty = auto-detect: whichever of WorldEdit/FAWE is installed, its own plugin data
    # folder + "/schematics". Set explicitly if your server's schematics live somewhere
    # else (e.g. FAWE per-player-folder configs vary by install).
    directory: ""

world:
  flatlands:
    # Name of the disposable superflat world /wipeflatlands manages. Created
    # automatically on first enable if it doesn't already exist.
    world-name: "flatlands"
    autowipe:
      enabled: true
      interval-hours: 24
      # Players still in the world get a broadcast warning this long before an
      # automatic wipe, then are evacuated to the main world's spawn when it happens.
      # /wipeflatlands (manual trigger) skips the warning and wipes immediately.
      warning-minutes-before: 5
    # Whether a wipe (manual /wipeflatlands or an automatic autowipe) restarts the whole
    # server as part of wiping, rather than deleting/recreating the world in-place while
    # the server keeps running. A restart guarantees the delete itself is reliable (no
    # world-folder file handles can still be held by the old process once it's actually
    # exited) at the cost of briefly disconnecting every player on the server, not just
    # those in the flatlands world. Set to false for the lower-disruption in-place
    # behavior instead.
    wipe-restarts-server: true
  spawn:
    # The actual spawn coordinates are NOT set here - run /setspawn (Senior Admin+) in
    # game to set/move it. They're stored in the database instead, like every other
    # runtime-set admin state (see world.SpawnService) - only these two behavior
    # toggles are operator-authored config.
    #
    # Who gets teleported to spawn on join - "always", "first_join" (default, TFM's own
    # default too - a returning player keeps wherever they last stood), or "never".
    send-on-join: "first_join"
    # Whether dying sends a player to spawn instead of their bed/respawn anchor.
    send-on-respawn: false

announce:
  broadcast:
    enabled: true
    interval-minutes: 15
    # MiniMessage format (https://docs.advntr.dev/minimessage/format.html) - this is
    # the "configurable with colors" part: any MiniMessage tag works here, e.g.
    # <red>, <gold>, <bold>, <gradient:blue:aqua>, etc.
    prefix: "<gray>[<gold>Announcement</gold>]</gray> "
    # Rotates through these in order, one every interval-minutes. Empty by default -
    # add your own before enabling, or the broadcaster just has nothing to say.
    messages: []

motd:
  enabled: true
  # Each entry is one full MOTD (MiniMessage format, \n for the second line). If more
  # than one is configured, a random one is shown per server-list ping - a TFM-style
  # rotating MOTD. Empty by default (falls back to whatever server.properties/the
  # platform would otherwise show) - add your own before relying on this.
  entries: []
    # - "<gold>Welcome to the server!\n<gray>Powered by <aqua>RigelMCMod"

discord:
  # Off by default - requires a bot token to do anything. See docs/architecture.md
  # "Discord bridge & admin chat" for the full design.
  bot-token: ""
  # Three separate channel IDs. public/admin mirror chat both directions; console is
  # one-way log output only. Leave blank to disable that specific bridge direction even
  # if the module as a whole is enabled.
  public-channel-id: ""
  admin-channel-id: ""
  console-channel-id: ""
  # Only players linked via /discord link AND at least this rank may run console
  # commands from the admin channel (via a "!"-prefixed message) - never from DMs,
  # never from the public/console channels.
  console-command-min-rank: senior_admin
  # How long a /discord link one-time code stays valid before expiring unused.
  link-code-ttl-minutes: 5
