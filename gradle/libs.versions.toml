[versions]
paper-api = "26.1.2.build.74-stable"
hikaricp = "7.1.0"
sqlite-jdbc = "3.53.2.1"
mariadb-jdbc = "3.5.10"
discord4j = "3.3.2"
# Compile-only, not runtime-resolved via RigelPluginLoader like the libraries above -
# PacketEvents is a soft *server* plugin dependency instead (paper-plugin.yml), matching
# TFM's own approach exactly: it's shared, singleton-shaped packet-listening
# infrastructure, and a privately-resolved second copy risks classloader/registration
# conflicts with any other plugin on the server also using it. See protect.crash.packet
# for the actual integration.
packetevents = "2.12.1"
# Compile-only, non-transitive - matches TFM's own exact pin (confirmed by reading its
# real build.gradle directly) and its own reasoning: worldedit-core pulls in a large,
# WorldEdit-version-specific dependency graph a compileOnly consumer never needs at
# runtime (the actual WorldEdit/FAWE plugin jar already provides all of it). See
# protect.worldedit.extent for the actual integration - this is the real, compile-time
# WorldEdit API dependency the presence-detection-only protect.worldedit.WorldEditBridge
# explicitly deferred needing.
worldedit = "7.3.10"
# Compile-only - EssentialsX is a hard requirement for this project (not a soft dependency
# like everything else above/below), but the Java API surface used against it
# (world.EssentialsWarpBridge) is small and stable, so this compiles directly against it
# rather than reflection. From 2.19.0 onward EssentialsX publishes under the
# net.essentialsx group id (previously net.ess3) - see repo.essentialsx.net.
essentialsx = "2.19.6"
# Compile-only, same category as paper-api above (not RigelPluginLoader-resolved) -
# Log4j2 is what Paper's own server logging/console is actually built on, always present
# on the runtime classpath. Needed for discord.ServerLogAppender's full-console mirror
# (registers directly on Log4j2's root logger, not a java.util.logging Handler - see its
# own javadoc for why). Exact version is a compile-time-only concern: AbstractAppender/
# LoggerContext/Configuration/Level have been stable across the whole 2.x line for years,
# so this doesn't need to match whatever exact 2.x build Paper 26.1.2 bundles at runtime.
log4j-core = "2.24.3"
junit-jupiter = "6.1.2"
shadow = "9.6.1"
run-paper = "3.0.2"
spotbugs-plugin = "6.5.10"
foojay-resolver = "1.0.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
discord4j = { module = "com.discord4j:discord4j-core", version.ref = "discord4j" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
essentialsx = { module = "net.essentialsx:EssentialsX", version.ref = "essentialsx" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j-core" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
